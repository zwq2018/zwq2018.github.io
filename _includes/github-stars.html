{%- assign metric = site.data.github_metrics[include.repo] -%}<a class="project-stars" data-github-repo="{{ include.repo | escape }}" href="{{ include.url | escape }}" title="{{ include.repo | escape }} repository: {{ metric.display_stars }} GitHub stars. Updated {{ metric.checked_at | date: '%Y-%m-%d' }}." aria-label="{{ include.repo | escape }}: {{ metric.display_stars }} GitHub stars"><span><i class="fab fa-github" aria-hidden="true"></i> {{ include.label }}</span><span class="project-stars-value">{{ metric.display_stars }}</span></a>
