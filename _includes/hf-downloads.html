{%- assign metric = site.data.huggingface_metrics[include.key] -%}<a class="hf-downloads" data-hf-metric="{{ include.key }}" href="{{ metric.url | escape }}" title="Hugging Face cumulative {{ metric.kind }} downloads: {{ metric.display_total }}. {{ metric.repos.size }} repository/repositories. Updated {{ metric.checked_at | date: '%Y-%m-%d' }}." aria-label="Hugging Face {{ metric.label }}: {{ metric.display_total }} total"><span class="hf-downloads-label">🤗 {{ metric.label }}</span><span class="hf-downloads-value">{{ metric.display_total }} Total</span></a>
